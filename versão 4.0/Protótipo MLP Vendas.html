<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Protótipo MLP Vendas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral verde-petróleo fixa + área de trabalho clara; no celular a barra vira gaveta.
   Mesma paleta e fonte das duas telas iniciais (Login e Painel). Estado e cores vêm todos dos tokens. */
:root{
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#F6F8F9;
  --ink:#12202B; --ink-2:#44545F; --ink-3:#5B6B76;
  --line:#DCE2E6; --line-strong:#B8C4CC;
  --brand:#0E3B43; --brand-ink:#FFFFFF; --brand-2:#C5D8DB; --brand-hover:rgba(255,255,255,.09); --brand-on:rgba(255,255,255,.14);
  --accent:#C2410C; --accent-hover:#9A3412; --on-accent:#FFFFFF;
  --focus:#1D6FD0;
  --sel-bg:#E3F1F3; --sel-line:#0E3B43;
  --seg-on-bg:#0E3B43; --seg-on-fg:#FFFFFF;
  --ok-bg:#DDF3E4; --ok-fg:#14532D;
  --warn-bg:#FFF1D6; --warn-fg:#7A4B00;
  --info-bg:#E3EAF2; --info-fg:#1F3A5C;
  --teal-bg:#D8EEF0; --teal-fg:#0B4A52;
  --danger-bg:#FBE3E0; --danger-fg:#8A1F11; --danger-line:#D9877B; --danger-solid:#B42318; --on-danger:#FFFFFF;
  --muted-bg:#E8ECEF; --muted-fg:#44545F;
  --toast-bg:#12202B; --toast-fg:#FFFFFF;
  --scrim:rgba(10,20,25,.55);
  --band:var(--surface);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1519; --surface:#131F25; --surface-2:#182830;
    --ink:#E8EEF1; --ink-2:#AFC0C9; --ink-3:#8FA2AD;
    --line:#243640; --line-strong:#3A5560;
    --brand:#08262B; --brand-ink:#FFFFFF; --brand-2:#9DB9BE; --brand-hover:rgba(255,255,255,.08); --brand-on:rgba(255,255,255,.14);
    --accent:#F28A55; --accent-hover:#F7A276; --on-accent:#1B0D05;
    --focus:#7DB4F5;
    --sel-bg:#12353B; --sel-line:#8ED3DB;
    --seg-on-bg:#D9EEF1; --seg-on-fg:#0A2A30;
    --ok-bg:#123524; --ok-fg:#8FE0AE;
    --warn-bg:#3A2B0A; --warn-fg:#F3C56B;
    --info-bg:#162B44; --info-fg:#9CC2F0;
    --teal-bg:#0E3A40; --teal-fg:#8ED3DB;
    --danger-bg:#3E1713; --danger-fg:#F5A79B; --danger-line:#8A4A41; --danger-solid:#F28B7C; --on-danger:#1B0705;
    --muted-bg:#1F2F37; --muted-fg:#AFC0C9;
    --toast-bg:#E8EEF1; --toast-fg:#0C1519;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1519; --surface:#131F25; --surface-2:#182830;
  --ink:#E8EEF1; --ink-2:#AFC0C9; --ink-3:#8FA2AD;
  --line:#243640; --line-strong:#3A5560;
  --brand:#08262B; --brand-ink:#FFFFFF; --brand-2:#9DB9BE; --brand-hover:rgba(255,255,255,.08); --brand-on:rgba(255,255,255,.14);
  --accent:#F28A55; --accent-hover:#F7A276; --on-accent:#1B0D05;
  --focus:#7DB4F5;
  --sel-bg:#12353B; --sel-line:#8ED3DB;
  --seg-on-bg:#D9EEF1; --seg-on-fg:#0A2A30;
  --ok-bg:#123524; --ok-fg:#8FE0AE;
  --warn-bg:#3A2B0A; --warn-fg:#F3C56B;
  --info-bg:#162B44; --info-fg:#9CC2F0;
  --teal-bg:#0E3A40; --teal-fg:#8ED3DB;
  --danger-bg:#3E1713; --danger-fg:#F5A79B; --danger-line:#8A4A41; --danger-solid:#F28B7C; --on-danger:#1B0705;
  --muted-bg:#1F2F37; --muted-fg:#AFC0C9;
  --toast-bg:#E8EEF1; --toast-fg:#0C1519;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{font-family:var(--font);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--band)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sidebar :focus-visible{outline-color:#fff}
#main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- estrutura ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;gap:22px;padding:22px 12px 16px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;padding:2px 8px 2px 0}
.brand .logo{display:block;max-width:100%;height:auto}
.brand-mark{width:44px;height:44px;border-radius:12px;background:#C2410C;color:#fff;display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:.02em;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--brand-2);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--brand-2);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.nav-i:hover{background:var(--brand-hover);color:#fff}
.nav-i.on{background:var(--brand-on);color:#fff;font-weight:700}
.nav-i.off{opacity:.75}
.nav-i em{margin-left:auto;white-space:nowrap;flex:none;font-style:normal;font-size:11px;font-weight:600;color:var(--brand-2);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:0 8px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot p{font-size:12px;color:var(--brand-2);padding:0 12px;line-height:1.4}
.scrim{display:none}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px max(var(--gut),env(safe-area-inset-right,0px)) 8px max(var(--gut),env(safe-area-inset-left,0px))}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);display:none;place-items:center;cursor:pointer}
.view-as{display:flex;align-items:center;gap:10px}
.view-as>span{font-size:12px;color:var(--ink-3);font-weight:600}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--teal-bg);color:var(--teal-fg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.user b{display:block;font-size:13px;line-height:1.2}
.user small{display:block;font-size:12px;color:var(--ink-3)}
:root{--gut:32px}
.page{max-width:1200px;width:100%;margin:0 auto;padding:28px max(var(--gut),env(safe-area-inset-right,0px)) 56px max(var(--gut),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-3);font-weight:600}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--line-strong)}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.ph p{color:var(--ink-2);max-width:62ch}
.ph-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph-a{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:800}
.card-b{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin:0;padding:20px}
.kv dt{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.kv dd{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.kv .wide{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-warn{background:var(--surface);border-color:var(--danger-line);color:var(--danger-fg)}
.btn-warn:hover{background:var(--danger-bg)}
.btn-danger{background:var(--danger-solid);color:var(--on-danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok-fg)}
.t-warn{background:var(--warn-bg);color:var(--warn-fg)}
.t-info{background:var(--info-bg);color:var(--info-fg)}
.t-teal{background:var(--teal-bg);color:var(--teal-fg)}
.t-danger{background:var(--danger-bg);color:var(--danger-fg)}
.t-muted{background:var(--muted-bg);color:var(--muted-fg)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 280px;min-width:0}
.search .ico{position:absolute;left:14px;top:13px;color:var(--ink-3);pointer-events:none}
.search .input{padding-left:42px}
.input,.select{width:100%;height:44px;border:1.5px solid var(--line-strong);border-radius:10px;padding:0 14px;background:var(--surface);font-size:16px;min-width:0}
.select{padding-right:10px}
.input::placeholder{color:var(--ink-3);opacity:1}
.input[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--danger-solid)}
.toolbar .select{width:auto;min-width:170px}
.tool-sel{flex:0 1 auto}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:12px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{min-height:36px;padding:0 14px;border:0;background:transparent;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on-bg);color:var(--seg-on-fg)}
.count{padding:12px 20px;font-size:13px;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:10px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{position:relative}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right}
.rowlink{font-weight:700;text-decoration:none}
.rowlink::after{content:"";position:absolute;inset:0}
.rowlink:hover{text-decoration:underline}
.sub{display:block;color:var(--ink-3);font-size:13px;font-weight:500}
.chev{color:var(--ink-3);width:40px;padding-left:0!important}
.only-sm{display:none}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-2)}
.empty b{font-size:15px;color:var(--ink)}
.empty .ico{color:var(--ink-3)}
.minilist{list-style:none;margin:0;padding:0}
.minilist li{position:relative;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.minilist li:last-child{border-bottom:0}
.minilist li:hover{background:var(--surface-2)}
.minilist .grow{flex:1;min-width:0}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--info-bg);color:var(--info-fg);font-weight:600}
.banner.t-danger{background:var(--danger-bg);color:var(--danger-fg)}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:13px}
.note .ico{margin-top:2px;color:var(--ink-3)}

/* ---------- formulários ---------- */
.form{display:flex;flex-direction:column;gap:20px;max-width:820px}
.fs{border:0;margin:0;padding:0;min-width:0}
.fs legend{padding:0;font-weight:800;font-size:15px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:700;font-size:13px}
.req{color:var(--danger-fg)}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--danger-fg);font-size:12.5px;font-weight:700}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt-box{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:700}
.opt-box small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
.opt input:checked+.opt-box{border-color:var(--sel-line);background:var(--sel-bg)}
.opt input:focus-visible+.opt-box{outline:3px solid var(--focus);outline-offset:2px}
.form-a{display:flex;flex-wrap:wrap;gap:12px;padding-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.login-brand{background:var(--brand);color:#fff;padding:56px max(48px,env(safe-area-inset-left,0px)) 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-brand h1{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:.01em;margin-top:18px}
.login-logo{display:block;max-width:100%}
.login-logo svg{display:block;max-width:100%;height:auto}
.login-brand p{color:var(--brand-2);font-size:17px;max-width:30ch;margin-top:12px;line-height:1.5}
.login-brand small{color:var(--brand-2);font-size:13px;max-width:44ch}
.login-form{display:grid;place-items:center;padding:40px max(32px,env(safe-area-inset-right,0px));background:var(--surface)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:28px;font-weight:800}
.login-card .lead{color:var(--ink-2)}
.pw{position:relative;display:flex}
.pw .input{padding-right:92px}
.pw button{position:absolute;right:4px;top:4px;height:36px;min-width:72px;border:0;background:transparent;font-weight:700;color:var(--ink);cursor:pointer;border-radius:8px}
.link{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:underline;background:none;border:0;cursor:pointer;padding:0;color:var(--ink)}

/* ---------- modal e aviso ---------- */
.modal-back{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{font-size:20px;font-weight:800;line-height:1.25}
.modal-b{display:flex;flex-direction:column;gap:12px;color:var(--ink-2)}
.modal-b ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.modal-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:90;display:grid;justify-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:12px 16px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;max-width:540px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- celular e tablet ---------- */
@media (max-width:1100px){
  .grid-2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:899px){
  :root{--gut:16px}
  .shell{display:block}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100%;z-index:50;transform:translateX(-102%);transition:transform .2s ease;padding-top:max(22px,env(safe-area-inset-top,0px))}
  .shell.drawer-open .sidebar{transform:none}
  .shell.drawer-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim);border:0}
  .icon-btn{display:grid}
  .user div{display:none}
  .view-as>span{display:none}
  .page{padding-top:20px;padding-bottom:40px}
  .ph h1{font-size:22px}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-brand{padding:max(40px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 28px max(24px,env(safe-area-inset-left,0px));gap:12px}
  .login-logo svg{width:210px}
  .login-brand small{display:none}
  .login-form{padding:28px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));align-items:start}
}
@media (max-width:760px){
  .tiles{gap:8px}
  .tile{padding:12px}
  .tile b{font-size:24px}
  .tile span{font-size:12px}
  .pnl-bar{border-radius:14px}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{display:block;padding:0;border:0;min-width:0}
  .tbl td.hide-sm{display:none}
  .tbl td.c-main{grid-column:1}
  .tbl td.c-status{grid-column:2;grid-row:1;align-self:start}
  .tbl td.only-sm{display:block;grid-column:1/-1;color:var(--ink-2);font-size:13px}
  .toolbar{padding:14px 16px}
  .toolbar .select{width:100%}
  .tool-sel{flex:1 1 100%}
  .toolbar .seg{width:100%}
  .toolbar .seg.seg-4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar .seg button{flex:1}
  .count{padding:10px 16px}
  .card-h{padding:14px 16px}

/* ========== utilidades ========== */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function hoje(){return new Date().toLocaleDateString('pt-BR');}
function ico(n,size){size=size||18;return '<svg class="ico" width="'+size+'" height="'+size+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function cli(id){return state.clientes.filter(function(c){return c.id===id;})[0];}
function obra(id){return state.obras.filter(function(o){return o.id===id;})[0];}
function fase(id){return FASES.filter(function(f){return f.id===id;})[0];}
function tipoNome(t){return t==='pf'?'Pessoa física':'Construtora';}
function obrasDe(cid){return state.obras.filter(function(o){return o.clienteId===cid;});}
function isAdmin(){return state.perfil==='administrador';}
function isCli(){return state.perfil==='cliente';}
function naoLidas(){return state.notifs.filter(function(n){return !n.lida&&n.rep==='Carla Nogueira';}).length;}
function faseBadge(id){var f=fase(id);return '<span class="pill t-'+f.tone+'">'+ico(f.icon,14)+esc(f.nome)+'</span>';}
function statusPill(ativo,fem){return ativo?'<span class="pill t-ok">'+ico('check',14)+(fem?'Ativa':'Ativo')+'</span>':'<span class="pill t-muted">'+ico('archive',14)+(fem?'Inativa':'Inativo')+'</span>';}
function nomeCli(id){var c=cli(id);return c?c.nome:'—';}

function maskTel(v){var d=String(v).replace(/\D/g,'').slice(0,11);
  if(d.length>10)return d.replace(/^(\d{2})(\d{5})(\d{0,4}).*/,'($1) $2-$3');
  if(d.length>6)return d.replace(/^(\d{2})(\d{4})(\d{0,4}).*/,'($1) $2-$3');
  if(d.length>2)return d.replace(/^(\d{2})(\d*)/,'($1) $2');
  return d?'('+d:'';}
function maskCPF(v){var d=String(v).replace(/\D/g,'').slice(0,11);
  return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');}
function maskCNPJ(v){var d=String(v).replace(/\D/g,'').slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');}
function digits(s){return String(s||'').replace(/\D/g,'');}
function emailOk(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);}

function toast(msg){
  var t=document.createElement('div');t.className='toast';t.innerHTML=ico('check',18)+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},4200);
}
var modalCtx=null;
function openModal(o){
  o.cancel=o.cancel||'Cancelar';
  closeModal(true);
  var id='m'+Date.now();
  $('#modal-root').innerHTML=
   '<div class="modal-back" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="'+id+'-t">'+
   '<h2 id="'+id+'-t">'+esc(o.title)+'</h2><div class="modal-b">'+o.body+'</div>'+
   (o.check?'<label class="check"><input type="checkbox" id="m-check"><span>'+esc(o.check)+'</span></label>':'')+
   '<div class="modal-f"><button type="button" class="btn btn-secondary" data-action="modal-cancel" id="m-cancel">'+esc(o.cancel)+'</button>'+
   '<button type="button" class="btn '+(o.tone==='danger'?'btn-danger':'btn-primary')+'" data-action="modal-ok" id="m-ok"'+(o.check?' disabled':'')+'>'+esc(o.ok)+'</button></div></div></div>';
  modalCtx={ok:o.onOk,opener:document.activeElement};
  $('#m-cancel').focus();
}
function closeModal(silent){
  var root=$('#modal-root');if(!root||!root.firstChild){modalCtx=null;return;}
  root.innerHTML='';
  if(!silent&&modalCtx&&modalCtx.opener&&document.contains(modalCtx.opener)){try{modalCtx.opener.focus();}catch(e){}}
  modalCtx=null;
}

/* ========== rotas ========== */
function parse(){
  var h=(location.hash||'').replace(/^#/,''),m;
  if(!h||h==='login')return {n:'login'};
  if(h==='clientes')return {n:'clientes'};
  if(h==='cliente-novo')return {n:'cliente-form'};
  if((m=h.match(/^cliente-(\d+)-editar$/)))return {n:'cliente-form',id:+m[1]};
  if((m=h.match(/^cliente-(\d+)$/)))return {n:'cliente',id:+m[1]};
  if(h==='obras')return {n:'obras'};
  if(h==='obra-nova')return {n:'obra-form'};
  if((m=h.match(/^obra-(\d+)-editar$/)))return {n:'obra-form',id:+m[1]};
  if((m=h.match(/^obra-(\d+)$/)))return {n:'obra',id:+m[1]};
  if(h==='usuarios')return {n:'usuarios'};
  if(h==='usuario-novo')return {n:'usuario-form'};
  if((m=h.match(/^usuario-(\d+)-editar$/)))return {n:'usuario-form',id:+m[1]};
  if((m=h.match(/^usuario-(\d+)$/)))return {n:'usuario',id:+m[1]};
  if(h==='representadas')return {n:'repds'};
  if(h==='representada-nova')return {n:'repd-form'};
  if((m=h.match(/^representada-(\d+)-editar$/)))return {n:'repd-form',id:+m[1]};
  if((m=h.match(/^representada-(\d+)$/)))return {n:'repd',id:+m[1]};
  if(h==='materiais')return {n:'materiais'};
  if(h==='material-novo')return {n:'mat-form'};
  if((m=h.match(/^material-(\d+)-editar$/)))return {n:'mat-form',id:+m[1]};
  if((m=h.match(/^material-(\d+)$/)))return {n:'mat',id:+m[1]};
  if(h==='painel')return {n:'painel'};
  if(h==='entregas')return {n:'entregas'};
  if((m=h.match(/^orcamento-(\d+)-entrega$/)))return {n:'ent-form',kind:'prev',id:+m[1]};
  if((m=h.match(/^entrega-(\d+)-concluir$/)))return {n:'ent-form',kind:'real',id:+m[1]};
  if(h==='orcamentos')return {n:'orcs'};
  if(h==='orcamento-novo')return {n:'orc-form',kind:'novo'};
  if((m=h.match(/^orcamento-(\d+)-reavaliar$/)))return {n:'orc-form',kind:'reav',id:+m[1]};
  if((m=h.match(/^orcamento-(\d+)-(aprovar|reprovar)$/)))return {n:'orc-dec',id:+m[1],tipo:m[2]};
  if((m=h.match(/^orcamento-(\d+)-versoes$/)))return {n:'orc-versoes',id:+m[1]};
  if((m=h.match(/^orcamento-(\d+)$/)))return {n:'orc',id:+m[1]};
  return {n:'clientes'};
}

  var elim=o&&o.comprador.eliminado,e={};
  if(!v.nome)e.nome='Informe o nome da obra.';
  if(!v.clienteId)e.clienteId='Selecione o cliente.';
  if(!v.endereco)e.endereco='Informe o endereço.';
  if(!v.cidade)e.cidade='Informe a cidade.';
  if(!v.padrao)e.padrao='Selecione o padrão.';
  if(!(parseInt(v.unidades,10)>=1))e.unidades='Informe um número de unidades maior que zero.';
  if(!elim){

    if(digits(v.ctel).length<10)e.ctel='Informe um telefone com DDD.';

  if(o){for(var k in dados)o[k]=dados[k];if(!elim){o.comprador.nome=v.cnome;o.comprador.tel=v.ctel;o.comprador.email=v.cemail;}toast('Obra alterada com sucesso');go('obra-'+id);}

/* ========== orçamentos (RF09) ========== */
var ST={pendente:{nome:'Pendente',tone:'warn',icon:'clock'},aprovado:{nome:'Aprovado',tone:'ok',icon:'check'},reprovado:{nome:'Reprovado',tone:'danger',icon:'x'}};
function stPill(s){var x=ST[s];return '<span class="pill t-'+x.tone+'">'+ico(x.icon,14)+x.nome+'</span>';}
function orc(id){return state.orcs.filter(function(o){return o.id===id;})[0];}
function repr(id){return state.representadas.filter(function(r){return r.id===id;})[0];}
function mat(id){return state.materiais.filter(function(m){return m.id===id;})[0];}
function vig(o){return o.versoes.filter(function(v){return v.vigente;})[0];}
function tot(v){return v.itens.reduce(function(s,i){return s+i.qtd*i.preco;},0);}
function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function dt(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function hojeISO(){var d=new Date(),z=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function clonaItens(it){return it.map(function(i){return {mid:i.mid,qtd:i.qtd,preco:i.preco};});}
function orcsDe(oid){return state.orcs.filter(function(o){return o.obraId===oid;});}

function difVersoes(a,b){
  var ma={},mb={},add=0,rem=0,chg=0;
  a.itens.forEach(function(i){ma[i.mid]=i;});b.itens.forEach(function(i){mb[i.mid]=i;});
  b.itens.forEach(function(i){var x=ma[i.mid];if(!x)add++;else if(x.qtd!==i.qtd||x.preco!==i.preco)chg++;});
  a.itens.forEach(function(i){if(!mb[i.mid])rem++;});
  var d=tot(b)-tot(a);
  return {add:add,rem:rem,chg:chg,pag:a.pag!==b.pag,delta:d,pct:tot(a)?d/tot(a)*100:0};
}
function difTexto(d){
  var p=[],s=d.delta>0?'+':(d.delta<0?'−':'');
  p.push(d.delta===0?'Total sem alteração':'Total '+s+brl(Math.abs(d.delta))+' ('+s+Math.abs(d.pct).toFixed(1).replace('.',',')+'%)');
  if(d.add)p.push(d.add+(d.add===1?' item adicionado':' itens adicionados'));
  if(d.rem)p.push(d.rem+(d.rem===1?' item removido':' itens removidos'));
  if(d.chg)p.push(d.chg+(d.chg===1?' item alterado':' itens alterados'));
  if(d.pag)p.push('condição de pagamento alterada');
  return p.join(' · ');
}
function tabelaItens(v){
  var rows=v.itens.map(function(i){var m=mat(i.mid),sub=i.qtd*i.preco;
    return '<tr><td class="c-main"><b>'+esc(m.descricao)+'</b><span class="sub">'+esc(m.codigo)+'</span></td>'+
      '<td class="hide-sm n num">'+i.qtd+' '+esc(m.unid||'un')+'</td><td class="hide-sm n num">'+brl(i.preco)+'</td><td class="hide-sm n num"><b>'+brl(sub)+'</b></td>'+
      '<td class="only-sm">'+i.qtd+' '+esc(m.unid||'un')+' × '+brl(i.preco)+' = <b>'+brl(sub)+'</b></td></tr>';}).join('');
  return '<table class="tbl"><thead><tr><th scope="col">Material</th><th scope="col" class="n">Qtd.</th><th scope="col" class="n">Valor unit.</th><th scope="col" class="n">Subtotal</th></tr></thead><tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td class="c-main">Total</td><td class="hide-sm"></td><td class="hide-sm"></td><td class="n num">'+brl(tot(v))+'</td></tr></tfoot></table>';
}

/* ----- lista ----- */
function orcsFiltrados(){
  var f=state.fq,q=norm(f.q);
  return state.orcs.filter(function(o){
    if(isCli()&&obra(o.obraId).clienteId!==state.clienteId)return false;
    if(f.status!=='todos'&&o.status!==f.status)return false;
    if(f.rep!=='todas'&&String(o.repId)!==f.rep)return false;
    var ob=obra(o.obraId);
    if(q&&norm(o.numero+' '+ob.nome+' '+nomeCli(ob.clienteId)).indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return b.numero-a.numero;});
}

/* ----- histórico de versões (ordem cronológica) ----- */

  var inner=head({crumbs:[[cl?'Meus orçamentos':'Orçamentos','orcamentos'],['Nº '+o.numero,'orcamento-'+id],['Histórico de versões']],title:'Histórico de versões',
      sub:'Orçamento nº '+o.numero+' · '+esc(ob.nome)+'. Da mais antiga para a mais recente; a versão vigente está destacada.',actions:'<a class="btn btn-secondary" href="#orcamento-'+id+'">'+ico('left')+'Voltar ao orçamento</a>'})+

function submitDec(form){

function semMudanca(d){

function submitOrc(){

var ME='Carla Nogueira';
var EST={pendente:{nome:'Pendente',tone:'warn',icon:'clock'},entregue:{nome:'Entregue',tone:'ok',icon:'check'},atrasada:{nome:'Atrasada',tone:'danger',icon:'alert'}};
function diasEntre(a,b){var A=Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)),B=Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10));return Math.round((B-A)/86400000);}
function ent(id){return state.entregas.filter(function(e){return e.id===id;})[0];}
function entsDe(oid){return state.entregas.filter(function(e){return e.orcId===oid;}).sort(function(a,b){return a.prevista<b.prevista?-1:1;});}
function entStatus(e){return e.real?'entregue':(e.prevista<hojeISO()?'atrasada':'pendente');}
function entPill(st){var x=EST[st];return '<span class="pill t-'+x.tone+'">'+ico(x.icon,14)+x.nome+'</span>';}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function cmpEnt(e){var d=diasEntre(e.prevista,e.real);return d===0?'Entregue no prazo':(d>0?'Entregue com '+plural(d,'dia','dias')+' de atraso':'Entregue '+plural(-d,'dia','dias')+' antes do previsto');}

    :'<div class="empty">'+ico('truck',28)+'<b>Nenhuma entrega registrada</b><span>Informe a data prevista para o Painel passar a acompanhar este orçamento.</span></div>';

function itensPainel(){
  var N=state.fp.dias,hj=hojeISO(),out=[],adm=isAdmin();
  state.orcs.forEach(function(o){
    var ob=obra(o.obraId);
    if(!adm&&ob.rep!==ME)return;
    if(adm&&state.fp.rep!=='todos'&&ob.rep!==state.fp.rep)return;
    if(o.status==='pendente'){var v=vig(o),d=diasEntre(v.data,hj);out.push({tipo:'pendente',orc:o,dias:d,parado:d>=N,nivel:d>=2*N?'alta':'media'});}
    entsDe(o.id).forEach(function(e){if(entStatus(e)==='atrasada'){var d=diasEntre(e.prevista,hj);out.push({tipo:'entrega',orc:o,ent:e,dias:d,nivel:d>=3?'alta':'media'});}});
  });

var UNIDS=[['un','Unidade (un)'],['barra','Barra'],['m','Metro (m)'],['cx','Caixa (cx)'],['kg','Quilo (kg)'],['fr','Frasco (fr)']];
function unidNome(u){var x=UNIDS.filter(function(k){return k[0]===u;})[0];return x?x[1]:u;}
function matUsos(id){return state.orcs.filter(function(o){return o.versoes.some(function(v){return v.itens.some(function(i){return i.mid===id;});});}).length;}
function repNomeM(id){var r=repr(id);return r?r.nome:'—';}
function matCodigoExiste(repId,codigo,ignorar){var c=norm(codigo);return state.materiais.some(function(m){return m.repId===repId&&norm(m.codigo)===c&&(!ignorar||m.id!==ignorar);});}

/* ----- lista (Consultar) ----- */
function matFiltrados(){
  var f=state.fm,q=norm(f.q);
  return state.materiais.filter(function(m){
    if(f.status==='ativos'&&!m.ativo)return false;
    if(f.status==='inativos'&&m.ativo)return false;
    if(f.rep!=='todas'&&String(m.repId)!==f.rep)return false;
    if(q&&norm(m.codigo+' '+m.descricao).indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){var ra=norm(repNomeM(a.repId)),rb=norm(repNomeM(b.repId));if(ra!==rb)return ra<rb?-1:1;return norm(a.codigo)<norm(b.codigo)?-1:1;});
}

function render(){
  var r=parse();
  if(isCli()&&r.n!=='login'&&['orcs','orc','orc-versoes','orc-dec'].indexOf(r.n)<0){location.replace('#orcamentos');return;}
  document.documentElement.style.setProperty('--band',r.n==='login'?'var(--brand)':'var(--surface)');
  var h;
  switch(r.n){
    case 'login':h=viewLogin();break;
    case 'clientes':h=viewClientes();break;
    case 'cliente':h=viewCliente(r.id);break;
    case 'cliente-form':h=viewClienteForm(r.id);break;
    case 'obras':h=viewObras();break;
    case 'obra':h=viewObra(r.id);break;
    case 'obra-form':h=viewObraForm(r.id);break;
    case 'orcs':h=isAdmin()?viewRestrito():viewOrcs();break;
    case 'orc':h=isAdmin()?viewRestrito():viewOrc(r.id);break;
    case 'orc-versoes':h=isAdmin()?viewRestrito():viewOrcVersoes(r.id);break;
    case 'usuarios':h=isAdmin()?viewUsuarios():viewRestritoUsr();break;
    case 'usuario':h=isAdmin()?viewUsuario(r.id):viewRestritoUsr();break;
    case 'usuario-form':h=isAdmin()?viewUsuarioForm(r.id):viewRestritoUsr();break;
    case 'repds':h=viewRepresentadas();break;
    case 'repd':h=viewRepresentada(r.id);break;
    case 'repd-form':h=viewRepresentadaForm(r.id);break;
    case 'materiais':h=viewMateriais();break;
    case 'mat':h=viewMaterial(r.id);break;
    case 'mat-form':h=viewMaterialForm(r.id);break;
    case 'painel':h=viewPainel();break;
    case 'entregas':h=isAdmin()?viewRestrito('Entregas são gerenciadas pelo Representante (RF11).'):viewEntregas();break;
    case 'ent-form':h=isAdmin()?viewRestrito('Entregas são gerenciadas pelo Representante (RF11).'):viewEntForm(r.kind,r.id);break;
    case 'orc-dec':h=viewOrcDecisao(r.id,r.tipo);break;
    case 'orc-form':h=isAdmin()?viewRestrito():viewOrcForm(r.kind,r.id);break;
    default:h=viewClientes();
  }
  mount(h);
}

/* ========== eventos ========== */
function syncTipo(form){
  var pf=form.querySelector('input[name="tipo"]:checked').value==='pf';
  $('#lbl-nome').textContent=pf?'Nome completo':'Razão social';
  $('#lbl-doc').textContent=pf?'CPF':'CNPJ';
  $('#hint-doc').textContent=pf?'Ex.: 000.000.000-00':'Ex.: 00.000.000/0000-00';
  var d=$('#f-doc');d.value=pf?maskCPF(d.value):maskCNPJ(d.value);
}
function confirmInativar(tipo,id){
  var isC=tipo==='cli',item=isC?cli(id):obra(id);
  var extra=isC?(obrasDe(id).filter(function(o){return o.ativo;}).length?'<p>Este cliente tem '+obrasDe(id).filter(function(o){return o.ativo;}).length+' obra(s) ativa(s); elas continuam cadastradas.</p>':''):'';
  openModal({title:(isC?'Inativar cliente?':'Inativar obra?'),
    body:'<p><b>'+esc(item.nome)+'</b> deixa de aparecer nas listas de '+(isC?'ativos':'ativas')+'. O histórico de '+(isC?'obras, ':'')+'orçamentos e entregas é mantido e você pode reativar depois.</p>'+extra,
    ok:'Inativar',onOk:function(){item.ativo=false;toast((isC?'Cliente':'Obra')+' inativ'+(isC?'ado':'ada')+' com sucesso');render();}});
}
function confirmEliminar(tipo,id){
  var isC=tipo==='cli',item=isC?cli(id):obra(id).comprador,alvo=isC?cli(id).nome:obra(id).comprador.nome;
  var quais=isC?(item.tipo==='pf'?'nome, CPF, telefone e e-mail':'nome, telefone e e-mail'):'nome, telefone e e-mail';
  openModal({title:'Eliminar dados pessoais?',tone:'danger',
    body:'<p>Titular: <b>'+esc(alvo)+'</b></p><ul><li>Serão eliminados: '+quais+'.</li><li>Obras, orçamentos e entregas continuam registrados, de forma anonimizada.</li><li>A ação não pode ser desfeita e fica no log de auditoria, com data, hora e usuário.</li></ul>',
    check:'Confirmo que o titular solicitou a eliminação dos dados (Lei 13.709/2018, art. 18).',ok:'Eliminar dados',
    onOk:function(){
      if(isC){item.nome='Titular anonimizado #'+item.id;item.doc='—';item.tel='—';item.email='';item.eliminado=hoje();}
      else{item.nome='';item.tel='';item.email='';item.eliminado=hoje();}
      toast('Dados pessoais eliminados com sucesso');render();}});
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-action]');if(!t)return;
  var a=t.getAttribute('data-action'),id=+t.getAttribute('data-id'),v=t.getAttribute('data-v');
  switch(a){
    case 'soon':toast(t.getAttribute('data-label')+' entra nos próximos lotes de telas');break;
    case 'logout':state.logged=false;location.hash='login';break;
    case 'forgot':toast('Recuperar senha (RF04) será desenhada em outro lote');break;
    case 'toggle-pass':var i=$('#l-senha'),show=i.type==='password';i.type=show?'text':'password';t.textContent=show?'Ocultar':'Mostrar';t.setAttribute('aria-pressed',String(show));break;
    case 'perfil':if(state.perfil!==v){state.perfil=v;if(v==='cliente')go('orcamentos');else render();}break;
    case 'notifs':abrirNotifs();break;
    case 'drawer-open':$('#shell').classList.add('drawer-open');t.setAttribute('aria-expanded','true');break;
    case 'drawer-close':$('#shell').classList.remove('drawer-open');break;
    case 'seg-cli':state.fc.status=v;refreshCli();break;
    case 'seg-obra':state.fo.status=v;refreshObra();break;
    case 'limpar-cli':state.fc={q:'',tipo:'todos',status:'todos'};render();break;
    case 'limpar-obra':state.fo={q:'',fase:'todas',status:'todas'};render();break;
    case 'inativar-cli':confirmInativar('cli',id);break;
    case 'reativar-cli':cli(id).ativo=true;toast('Cliente reativado com sucesso');render();break;
    case 'eliminar-cli':confirmEliminar('cli',id);break;
    case 'inativar-obra':confirmInativar('obra',id);break;
    case 'reativar-obra':obra(id).ativo=true;toast('Obra reativada com sucesso');render();break;
    case 'eliminar-comp':confirmEliminar('comp',id);break;
    case 'seg-repd':state.frp.status=v;refreshRepd();break;
    case 'limpar-repd':state.frp={q:'',status:'todas'};render();break;
    case 'inativar-repd':confirmInativarRepd(id);break;
    case 'reativar-repd':repr(id).ativa=true;toast('Representada reativada com sucesso');render();break;
    case 'ver-mats':state.fm={q:'',rep:String(id),status:'todos'};go('materiais');break;
    case 'novo-mat-rep':state.prefillRep=id;go('material-novo');break;
    case 'seg-mat':state.fm.status=v;refreshMat();break;
    case 'limpar-mat':state.fm={q:'',rep:'todas',status:'todos'};render();break;
    case 'inativar-mat':confirmInativarMat(id);break;
    case 'reativar-mat':mat(id).ativo=true;toast('Material reativado com sucesso');render();break;
    case 'seg-usr':state.fu.status=v;refreshUsr();break;
    case 'limpar-usr':state.fu={q:'',perfil:'todos',status:'todos'};render();break;
    case 'inativar-usr':confirmInativarUsr(id);break;
    case 'reativar-usr':usr(id).ativo=true;toast('Usuário reativado com sucesso');render();break;
    case 'seg-ent':state.fe.status=v;refreshEnt();break;
    case 'limpar-ent':state.fe={q:'',status:'todos'};render();break;
    case 'seg-pnl':state.fp.tipo=v;refreshPainel();break;
    case 'seg-orc':state.fq.status=v;refreshOrc();break;
    case 'limpar-orc':state.fq={q:'',status:'todos',rep:'todas'};render();break;
    case 'novo-orc-obra':state.prefillObra=id;go('orcamento-novo');break;
    case 'add-item':state.draft.itens.push({mid:'',qtd:1,preco:0});refreshItens(true);break;
    case 'rm-item':state.draft.itens.splice(+t.getAttribute('data-ix'),1);refreshItens();var ab=$('[data-action="add-item"]');if(ab)ab.focus();break;
    case 'nova-obra-cli':state.prefillCliente=id;go('obra-nova');break;
    case 'modal-cancel':closeModal();break;
    case 'modal-backdrop':if(ev.target===t)closeModal();break;
    case 'modal-ok':var fn=modalCtx&&modalCtx.ok;closeModal(true);if(fn)fn();break;
  }
  if(t.closest('.sidebar')&&a!=='drawer-open'){var sh=$('#shell');if(sh)sh.classList.remove('drawer-open');}
});
document.addEventListener('click',function(ev){
  var l=ev.target.closest('.sidebar a.nav-i');if(l){var sh=$('#shell');if(sh)sh.classList.remove('drawer-open');}
});
function refreshCli(){var el=$('#list-cli');if(!el)return;el.innerHTML=listaClientes();document.querySelectorAll('[data-action="seg-cli"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===state.fc.status));});}
function refreshOrc(){var el=$('#list-orc');if(!el)return;el.innerHTML=listaOrcs();document.querySelectorAll('[data-action="seg-orc"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===state.fq.status));});}
function refreshObra(){var el=$('#list-obra');if(!el)return;el.innerHTML=listaObras();document.querySelectorAll('[data-action="seg-obra"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===state.fo.status));});}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q-cli'){state.fc.q=t.value;refreshCli();}
  else if(t.id==='q-obra'){state.fo.q=t.value;refreshObra();}
  else if(t.id==='q-orc'){state.fq.q=t.value;refreshOrc();}
  else if(t.id==='q-ent'){state.fe.q=t.value;refreshEnt();}
  else if(t.id==='q-repd'){state.frp.q=t.value;refreshRepd();}
  else if(t.id==='q-mat'){state.fm.q=t.value;refreshMat();}
  else if(t.id==='q-usr'){state.fu.q=t.value;refreshUsr();}
  else if(t.id==='l-email'){state.loginEmail=t.value;}
  else if(t.id==='o-pag'&&state.draft){state.draft.pag=t.value;clearErrFor(t);}
  else if(t.getAttribute&&state.draft&&(t.getAttribute('data-f')==='qtd'||t.getAttribute('data-f')==='preco')){clearErrFor(t);onItem(t);}
  else if(t.getAttribute&&t.getAttribute('data-mask')){
    var m=t.getAttribute('data-mask');
    if(m==='tel')t.value=maskTel(t.value);
    else if(m==='doc'){var f=t.form.querySelector('input[name="tipo"]:checked');t.value=(f&&f.value==='pf')?maskCPF(t.value):maskCNPJ(t.value);}
  }
  else if(t.id==='m-check'){$('#m-ok').disabled=!t.checked;}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='tipo-cli'){state.fc.tipo=t.value;refreshCli();}
  else if(t.id==='fase-obra'){state.fo.fase=t.value;refreshObra();}
  else if(t.id==='rep-orc'){state.fq.rep=t.value;refreshOrc();}
  else if(t.id==='rep-mat'){state.fm.rep=t.value;refreshMat();}
  else if(t.id==='perfil-usr'){state.fu.perfil=t.value;refreshUsr();}
  else if(t.name==='perfil'&&t.form&&t.form.id==='f-usuario'){var fc=$('#fld-cli');if(fc){if(t.value==='cliente')fc.removeAttribute('hidden');else fc.setAttribute('hidden','');}}
  else if(t.id==='dias-pnl'){state.fp.dias=+t.value;refreshPainel();}
  else if(t.id==='rep-pnl'){state.fp.rep=t.value;refreshPainel();}
  else if(t.id==='o-obra'&&state.draft){state.draft.obraId=t.value;clearErrFor(t);}
  else if(t.id==='o-rep'&&state.draft){clearErrFor(t);state.draft.repId=t.value;state.draft.itens=t.value?[{mid:'',qtd:1,preco:0}]:[];refreshItens();}
  else if(t.getAttribute&&state.draft&&t.getAttribute('data-f')==='mid'){
    var ix=+t.getAttribute('data-ix'),it=state.draft.itens[ix],m=t.value?mat(+t.value):null;
    clearErrFor(t);it.mid=t.value?+t.value:'';it.preco=m?m.preco:0;refreshItens();var nf=$('#im-'+ix);if(nf)nf.focus();}
  else if(t.name==='tipo'&&t.form&&t.form.id==='f-cliente'){syncTipo(t.form);}
  else if(t.name==='lp'){state.loginPerfil=t.value;var pu=state.usuarios.filter(function(x){return x.perfil===t.value&&x.ativo;})[0];if(pu){state.loginEmail=pu.email;var le=$('#l-email');if(le)le.value=pu.email;}}
  else if(t.id==='m-check'){$('#m-ok').disabled=!t.checked;}
});
document.addEventListener('submit',function(ev){
  var f=ev.target;ev.preventDefault();
  if(f.id==='f-login'){
    var em=String($('#l-email').value||'').trim(),lu=usuarioPorEmail(em);state.loginEmail=em;
    if(lu&&!lu.ativo){state.loginErr='Este usuário está inativo e não pode acessar o sistema. Procure o administrador.';render();var lb=$('#login-err');if(lb)lb.focus();return;}
    state.loginErr=null;
    if(lu){state.perfil=lu.perfil;state.loginPerfil=lu.perfil;if(lu.perfil==='cliente')state.clienteId=lu.clienteId;}else state.perfil=state.loginPerfil;
    state.logged=true;go(state.perfil==='cliente'?'orcamentos':'painel');}
  else if(f.id==='f-cliente')submitCliente(f);
  else if(f.id==='f-obra')submitObra(f);
  else if(f.id==='f-orc')submitOrc();
  else if(f.id==='f-dec')submitDec(f);
  else if(f.id==='f-ent')submitEnt(f);
  else if(f.id==='f-usuario')submitUsuario(f);
  else if(f.id==='f-material')submitMaterial(f);
  else if(f.id==='f-representada')submitRepresentada(f);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){
    if($('#modal-root').firstChild){closeModal();return;}
    var sh=$('#shell');if(sh&&sh.classList.contains('drawer-open')){sh.classList.remove('drawer-open');var b=$('[data-action="drawer-open"]');if(b){b.setAttribute('aria-expanded','false');b.focus();}}
  }
  if(ev.key==='Tab'&&$('#modal-root').firstChild){
    var els=Array.prototype.slice.call($('#modal-root').querySelectorAll('button:not([disabled]),input,[href]'));
    if(!els.length)return;var first=els[0],last=els[els.length-1];
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
    else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
  }
});
window.addEventListener('hashchange',function(){
  closeModal(true);state.draft=null;state.decErr=null;state.entErr=null;state.entVal='';if(!/-reprovar$/.test(location.hash))state.decMotivo='';
  var h=(location.hash||'').replace(/^#/,'');
  if(h&&h!=='login')state.logged=true;
  render();window.scrollTo(0,0);
  var m=$('#main');if(m)m.focus({preventScroll:true});
});

/* início: sem endereço no link, abre no login; com endereço, abre direto na tela */
if((location.hash||'').replace(/^#/,'')&&location.hash!=='#login')state.logged=true;
render();
})();
</script>
