<text x="110" y="1588" font-size="13" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >Associação</text>
<line x1="50" y1="1620" x2="90" y2="1620" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
