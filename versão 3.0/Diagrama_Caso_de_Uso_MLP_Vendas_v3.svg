<line x1="50" y1="1658" x2="90" y2="1658" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="110" y="1664" font-size="13" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >«extend» (relação de extensão)</text>
<line x1="50" y1="1696" x2="90" y2="1696" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#gen-arrow)"/>
<text x="110" y="1702" font-size="13" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >Generalização (ator especializa outro)</text>
<rect x="540" y="1450" width="1180" height="330" rx="6" fill="#F8F8FF" stroke="#B4B2A9" stroke-width="1"/>
<text x="558" y="1476" font-size="14" font-weight="700" text-anchor="start" fill="#2C2C2A" font-family="Arial, sans-serif" >Observações:</text>
<text x="558" y="1502" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >Diagrama de alto nível com os 13 requisitos funcionais do sistema MLP VENDAS.</text>
<text x="558" y="1524" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >Ator principal: Representante Comercial. Ator interno: Administrador (usuários, materiais, representadas e visão</text>
<text x="558" y="1546" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >consolidada do painel; elimina dados pessoais a pedido do titular, em RF05). Atores externos: Cliente (aprova/reprova o próprio orçamento) e Representada.</text>
<text x="558" y="1568" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >Administrador, Representante Comercial e Cliente são especializações (generalização) do ator genérico</text>
<text x="558" y="1590" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >"Usuário do Sistema", já que os três perfis realizam login e logout da mesma forma — por isso RF02 e RF03</text>
<text x="558" y="1612" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >recebem uma única associação, vinda do ator genérico, em vez de uma linha repetida por perfil.</text>
<text x="558" y="1634" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >RF04 (Recuperar Senha) é «extend» de RF02, por ocorrer apenas no fluxo excepcional de "esqueci a senha".</text>
<text x="558" y="1656" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >RF01 (Gerenciar Usuário) permanece exclusivo do Administrador, e RF10 (Aprovar/Reprovar Orçamento) é</text>
<text x="558" y="1678" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >específico do Cliente — por isso essas associações partem dos atores especializados, não do genérico.</text>
<text x="558" y="1700" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >RF12 é alcançado via «include» a partir do login; também recebe dados de RF07, RF09 e RF11 (não desenhados</text>
<text x="558" y="1722" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >individualmente, para não poluir o diagrama).</text>
<text x="558" y="1744" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >As funcionalidades de "gerenciar" contemplam cadastrar, alterar, inativar e consultar, conforme o documento</text>
<text x="558" y="1766" font-size="12.5" font-weight="400" text-anchor="start" fill="#444441" font-family="Arial, sans-serif" >de casos de uso.</text>
</svg>